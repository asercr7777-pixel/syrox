name: Cleanup notification UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete notification code
        shell: python
        run: |
          from pathlib import Path
          import re
          auth = Path('src/lib/auth.tsx')
          text = auth.read_text()
          text = re.sub(r"^import \{ setExternalUserId, removeExternalUserId \} from './onesignal';\n", "", text, flags=re.M)
          text = re.sub(r"\n\s*if \(data\.session\?\.user\) \{\s*void setExternalUserId\(data\.session\.user\.id\);\s*\}", "", text)
          text = re.sub(r"\n\s*\(async \(\) => \{.*?removeExternalUserId\(\);.*?\}\)\(\);", "", text, flags=re.S)
          auth.write_text(text)
          settings = Path('src/views/Settings.tsx')
          text = settings.read_text()
          text = re.sub(r"import \{\n\s*Upload, Trash2, Volume2, VolumeX, Bell, Palette, User as UserIcon,\n\s*Image as ImageIcon, Video, Sparkles, LogOut, Sun, Moon, Shield, Eye,\n\s*BellRing, BellOff, Loader2, ChevronRight, AlarmClock,\n\s*\} from 'lucide-react';", "import {\n  Upload, Trash2, Volume2, VolumeX, Palette, User as UserIcon,\n  Image as ImageIcon, Video, Sparkles, LogOut, Sun, Moon, Shield, Eye,\n} from 'lucide-react';", text)
          text = re.sub(r"\nimport \{ isOneSignalConfigured, subscribeToPush, unsubscribeFromPush, isPushSubscribed \} from '../lib/onesignal';", "", text)
          text = text.replace(', updateNotifications', '')
          text = re.sub(r"\n\s*const \[pushLoading, setPushLoading\] = useState\(false\);\n\s*const \[pushEnabled, setPushEnabled\] = useState\(false\);", "", text)
          text = re.sub(r"\n\s*useEffect\(\(\) => \{\s*if \(!isOneSignalConfigured\(\)\) return;.*?\}, \[\]\);", "", text, flags=re.S)
          text = re.sub(r"\n\s*const handleTogglePush = async \(\) => \{.*?\n\s*\};", "", text, flags=re.S)
          text = re.sub(r"export function Settings\(\{ onNavigate \}: \{ onNavigate\?: \(v: any\) => void \}\)", "export function Settings()", text)
          text = re.sub(r"\n\s*\{\/\* Notifications \*\/\}.*?(?=\n\s*\{\/\* Sounds \*\/\})", "\n", text, flags=re.S)
          if 'const handleSignOut = async () =>' not in text:
            text = text.replace('  const { signOut, user } = useAuth();', "  const { signOut, user } = useAuth();\n  const handleSignOut = async () => { playSound('click'); await signOut(); };")
          settings.write_text(text)
          app = Path('src/App.tsx')
          text = app.read_text().replace('<Settings onNavigate={handleNavigate} />', '<Settings />')
          app.write_text(text)
          for name in ['public/OneSignalSDK-v16-ServiceWorker.zip', 'src/lib/onesignal.ts', 'src/components/pwa/UpdateNotification.tsx']:
            p = Path(name)
            if p.exists(): p.unlink()
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove obsolete notification code"
          git push
