name: Core Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy economy from core logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          store = Path('src/store/useStore.ts')
          text = store.read_text()
          text = text.replace("import { getMarketItem, type MarketCategory } from '../data/marketplace';\n", '')

          # Main dungeon: XP/progression only.
          text = re.sub(
              r"drops = generateDrops\(dungeon\.auraDropBonus\);\n\s*const next = addPoints\(s, dungeon\.rewardXp, dungeon\.rewardXp\);\n\s*return \{ \.\.\.next, dungeonClearedToday: true, lastDungeonDate: todayStr\(\), dungeonsCleared: next\.dungeonsCleared \+ 1 \};",
              "const next = addPoints(s, dungeon.rewardXp, dungeon.rewardXp);\n    return { ...next, dungeonClearedToday: true, lastDungeonDate: todayStr(), dungeonsCleared: next.dungeonsCleared + 1 };",
              text, count=1)

          # Secret dungeon: remove coins/items from the persisted reward path, keep XP and completion state.
          text = re.sub(
              r"drops = generateDrops\(0\.15\);\n\s*drops\.push\(\{ type: 'aura'.*?\n\s*drops\.push\(\{ type: 'title'.*?\n\s*let next = addPoints\(s, dungeon\.rewardXp, dungeon\.rewardXp\);\n\s*next = \{ \.\.\.next, coins: next\.coins \+ dungeon\.rewardCoins, secretDungeonAvailable: false, secretDungeonId: null, secretDungeonExpiresAt: null, dungeonsCleared: next\.dungeonsCleared \+ 1 \};\n\s*const existing = new Set\(next\.inventory\.map\(\(i\) => `\$\{i\.type\}:\$\{i\.id\}`\)\);\n\s*const newItems = drops\.filter\(.*?\);\n\s*return \{ \.\.\.next, inventory: \[\.\.\.next\.inventory, \.\.\.newItems\] \};",
              "const next = addPoints(s, dungeon.rewardXp, dungeon.rewardXp);\n    return { ...next, secretDungeonAvailable: false, secretDungeonId: null, secretDungeonExpiresAt: null, dungeonsCleared: next.dungeonsCleared + 1 };",
              text, count=1, flags=re.S)

          # Boss completion: XP/progression only; keep boss defeat state and HP.
          text = re.sub(
              r"next = \{ \.\.\.next, bossDefeated: \{ \.\.\.next\.bossDefeated, \[bossId\]: true \}, coins: next\.coins \+ BOSS_DUNGEON\.rewardCoins \ };\n\s*next = addPoints\(next, BOSS_DUNGEON\.rewardXp, BOSS_DUNGEON\.rewardXp\);\n\s*drops = \[.*?\];\n\s*const existing = new Set\(next\.inventory\.map\(\(i\) => `\$\{i\.type\}:\$\{i\.id\}`\)\);\n\s*const newItems = drops\.filter\(.*?\);\n\s*return \{ \.\.\.next, inventory: \[\.\.\.next\.inventory, \.\.\.newItems\] \};",
              "next = addPoints(next, BOSS_DUNGEON.rewardXp, BOSS_DUNGEON.rewardXp);\n      return { ...next, bossDefeated: { ...next.bossDefeated, [bossId]: true } };",
              text, count=1, flags=re.S)

          # Story workout completion must not pass coin rewards.
          workout = Path('src/components/SixDayWorkout.tsx')
          w = workout.read_text()
          w = w.replace('completeStoryMission(mission.id, { xp: mission.xpReward, coins: mission.coinReward })', 'completeStoryMission(mission.id, { xp: mission.xpReward })')
          workout.write_text(w)

          store.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useStore.ts src/components/SixDayWorkout.tsx
          git diff --cached --quiet || git commit -m "refactor: remove legacy economy from core rewards"
          git push
