name: Core Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Apply core reward cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          store = Path('src/store/useStore.ts')
          text = store.read_text()
          text = text.replace("import { getMarketItem, type MarketCategory } from '../data/marketplace';\n", '')

          start = text.find('    let next = addPoints(s, dungeon.rewardXp, dungeon.rewardXp);')
          end = text.find('    });\n  }\n\n  function clearSecretDungeon', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('clearDungeon reward section not found; refusing unsafe edit')
          replacement = "    const next = addPoints(s, dungeon.rewardXp, dungeon.rewardXp);\n    return { ...next, dungeonClearedToday: true, lastDungeonDate: todayStr(), dungeonsCleared: next.dungeonsCleared + 1 };\n"
          text = text[:start] + replacement + text[end:]

          marker = 'dailyXp:'
          cap_start = text.find(marker)
          cap_end = text.find('    ...', cap_start)
          if cap_start < 0:
              raise SystemExit('daily cap section not found; refusing unsafe edit')
          text = text[:cap_start] + "dailyXp: Math.max(0, Math.min(Number.isFinite(cloudState.dailyXp) ? cloudState.dailyXp : 0, 1000)),\n    dailyPoints: Math.max(0, Number.isFinite(cloudState.dailyPoints) ? cloudState.dailyPoints : 0),\n    dailyCap: 1000,\n" + text[cap_end:]
          store.write_text(text)

          workout = Path('src/components/SixDayWorkout.tsx')
          w = workout.read_text()
          w = w.replace('completeStoryMission(mission.id, { xp: mission.xpReward, coins: mission.coinReward })', 'completeStoryMission(mission.id, { xp: mission.xpReward })')
          workout.write_text(w)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useStore.ts src/components/SixDayWorkout.tsx
          git diff --cached --quiet || git commit -m "refactor: make core progression XP-only"
          git push
