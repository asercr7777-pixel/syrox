name: Core Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Apply core reward cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          store = Path('src/store/useStore.ts')
          text = store.read_text()
          text = text.replace("import { getMarketItem, type MarketCategory } from '../data/marketplace';\n", '')

          pattern = re.compile(r"\n\s*let next = addPoints\(s, dungeon\.rewardXp, dungeon\.rewardXp\);.*?\n\s*return \{\.\.\.next, inventory: \[\.\.\.next\.inventory, \.\.\.rewardItems\]\};", re.S)
          replacement = "\n    const next = addPoints(s, dungeon.rewardXp, dungeon.rewardXp);\n    return { ...next, dungeonClearedToday: true, lastDungeonDate: todayStr(), dungeonsCleared: next.dungeonsCleared + 1 };"
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'clearDungeon reward section match count={count}; refusing unsafe edit')

          cap_pattern = re.compile(r"dailyXp:\s*Math\.max\(0, Math\.min\(Number\.isFinite\(cloudState\.dailyXp\).*?dailyCap:\s*Math\.max\(1, Number\.isFinite\(cloudState\.dailyCap\).*?\),", re.S)
          cap_replacement = "dailyXp: Math.max(0, Math.min(Number.isFinite(cloudState.dailyXp) ? cloudState.dailyXp : 0, 1000)),\n    dailyPoints: Math.max(0, Number.isFinite(cloudState.dailyPoints) ? cloudState.dailyPoints : 0),\n    dailyCap: 1000,"
          text, cap_count = cap_pattern.subn(cap_replacement, text, count=1)
          if cap_count != 1:
              raise SystemExit(f'daily cap match count={cap_count}; refusing unsafe edit')
          store.write_text(text)

          workout = Path('src/components/SixDayWorkout.tsx')
          w = workout.read_text()
          w2 = w.replace('completeStoryMission(mission.id, { xp: mission.xpReward, coins: mission.coinReward })', 'completeStoryMission(mission.id, { xp: mission.xpReward })')
          workout.write_text(w2)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useStore.ts src/components/SixDayWorkout.tsx
          git diff --cached --quiet || git commit -m "refactor: make core progression XP-only"
          git push
