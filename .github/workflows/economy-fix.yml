name: Economy safe fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[economy-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe store fix
        run: python .github/economy-fix.py
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit validated fix and clean helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useStore.ts
          git rm .github/economy-fix.py .github/workflows/economy-fix.yml
          git commit -m "Fix store validation issues [economy-fix]"
          git push
