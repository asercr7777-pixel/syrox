name: Economy hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[economy-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch economy safeguards
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/store/useStore.ts')
          text = path.read_text()

          if "from '../data/marketplace'" not in text:
              text = text.replace(
                  "import { ALL_CHAPTERS, getTotalChapters } from '../data/story';",
                  "import { ALL_CHAPTERS, getTotalChapters } from '../data/story';\nimport { getMarketItem, type MarketCategory } from '../data/marketplace';"
              )

          purchase_pattern = r"function purchaseItem\(itemId: string, category: string, price: number\): boolean \{.*?\n\}\n\nfunction completeStoryMission"
          purchase_replacement = '''function purchaseItem(itemId: string, category: string, price: number): boolean {
  let success = false;
  setState((s) => {
    const marketItem = getMarketItem(itemId, category as MarketCategory);
    if (!marketItem) return s;
    if (price !== marketItem.price) return s;
    if (s.xp < marketItem.xpRequired) return s;
    if (s.coins < marketItem.price) return s;

    const typeMap: Record<MarketCategory, InventoryItem['type']> = {
      weapons: 'weapon',
      auras: 'aura',
      titles: 'title',
      shields: 'shield',
      frames: 'frame',
      backgrounds: 'background',
    };
    const type = typeMap[marketItem.category];
    if (s.inventory.some((i) => i.id === itemId && i.type === type)) return s;

    success = true;
    playSound('reward');
    return {
      ...s,
      coins: s.coins - marketItem.price,
      inventory: [...s.inventory, { id: itemId, type, obtainedAt: Date.now(), favorite: false }],
    };
  });
  return success;
}

function completeStoryMission'''
          text, count = re.subn(purchase_pattern, purchase_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('purchaseItem patch target not found')

          damage_pattern = r"function damageBoss\(amount: number\): DropResult\[\] \{.*?\n\}\n\nfunction clearSecretDungeon"
          damage_replacement = '''function damageBoss(amount: number): DropResult[] {
  let drops: DropResult[] = [];
  setState((s) => {
    const bossId = 'dungeon_boss';
    if (s.bossDefeated[bossId]) return s;
    const currentHp = s.bossHpRemaining[bossId] ?? (BOSS_DUNGEON as any).hp;
    const safeAmount = Math.max(0, Math.min(100, Math.floor(Number.isFinite(amount) ? amount : 0)));
    if (safeAmount <= 0) return s;
    const actualDamage = Math.min(safeAmount, currentHp);
    const newHp = Math.max(0, currentHp - actualDamage);
    let next = addPoints(s, actualDamage, actualDamage);
    next = { ...next, bossHpRemaining: { ...next.bossHpRemaining, [bossId]: newHp } };
    if (newHp === 0) {
      next = { ...next, bossDefeated: { ...next.bossDefeated, [bossId]: true }, coins: next.coins + BOSS_DUNGEON.rewardCoins };
      next = addPoints(next, BOSS_DUNGEON.rewardXp, BOSS_DUNGEON.rewardXp);
      drops = [
        { type: 'aura', itemId: BOSS_DUNGEON.auraId, rarity: 'legendary', label: 'Shadow Monarch Aura' },
        { type: 'title', itemId: BOSS_DUNGEON.titleId, rarity: 'legendary', label: 'Shadow Monarch Title' },
        { type: 'badge', itemId: BOSS_DUNGEON.badgeId, rarity: 'legendary', label: 'Boss Slayer Badge' },
      ];
      const newItems: InventoryItem[] = drops
        .filter((d) => d.itemId && !next.inventory.some((i) => i.id === d.itemId && i.type === d.type as any))
        .map((d) => ({ id: d.itemId!, type: d.type as any, obtainedAt: Date.now(), favorite: false }));
      return { ...next, inventory: [...next.inventory, ...newItems] };
    }
    return next;
  });
  playSound('task');
  return drops;
}

function clearSecretDungeon'''
          text, count = re.subn(damage_pattern, damage_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('damageBoss patch target not found')

          attack_pattern = r"function attackBoss\(bossId: string, damage: number\): DropResult\[\] \{.*?\n\}\n\nfunction openChest"
          attack_replacement = '''function attackBoss(bossId: string, damage: number): DropResult[] {
  let drops: DropResult[] = [];
  setState((s) => {
    if (s.bossDefeated[bossId]) return s;
    const currentHp = s.bossHpRemaining[bossId] ?? 0;
    const safeDamage = Math.max(0, Math.min(100, Math.floor(Number.isFinite(damage) ? damage : 0)));
    if (safeDamage <= 0 || currentHp <= 0) return s;
    const actualDamage = Math.min(safeDamage, currentHp);
    const newHp = Math.max(0, currentHp - actualDamage);
    let next = addPoints(s, actualDamage, actualDamage);
    next = { ...next, bossHpRemaining: { ...next.bossHpRemaining, [bossId]: newHp } };
    if (newHp === 0) {
      next = { ...next, bossDefeated: { ...next.bossDefeated, [bossId]: true }, activeBossId: null };
      drops = [{ type: 'coins', amount: 500, label: '500 Coins' }];
      next = { ...next, coins: next.coins + 500 };
      playSound('rankup');
    } else {
      playSound('task');
    }
    return next;
  });
  return drops;
}

function openChest'''
          text, count = re.subn(attack_pattern, attack_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('attackBoss patch target not found')

          chest_pattern = r"(const item = pickFromRarity\(pool, rarity\);\n      if \(item\) \{\n        result = \{ type: pick as any, itemId: item.id, rarity, label: item.name \};\n        return \{\n          \.\.\.s,\n          chestInventory: \{ \.\.\.s\.chestInventory, \[chestId\]: count - 1 \},\n          inventory: \[\.\.\.s\.inventory, \{ id: item\.id, type: pick as any, obtainedAt: Date\.now\(\), favorite: false \}\],\n        \};\n      \})"
          chest_replacement = '''const item = pickFromRarity(pool, rarity);
      if (item) {
        result = { type: pick as any, itemId: item.id, rarity, label: item.name };
        const alreadyOwned = s.inventory.some((i) => i.id === item.id && i.type === pick as any);
        if (alreadyOwned) {
          const duplicateValue = 100;
          result = { type: 'coins', amount: duplicateValue, label: `${duplicateValue} Coins (duplicate conversion)` };
          return {
            ...s,
            chestInventory: { ...s.chestInventory, [chestId]: count - 1 },
            coins: s.coins + duplicateValue,
          };
        }
        return {
          ...s,
          chestInventory: { ...s.chestInventory, [chestId]: count - 1 },
          inventory: [...s.inventory, { id: item.id, type: pick as any, obtainedAt: Date.now(), favorite: false }],
        };
      }'''
          text, count = re.subn(chest_pattern, chest_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('openChest patch target not found')

          path.write_text(text)
      - name: Validate and commit
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useStore.ts .github/workflows/economy-hardening.yml
          git commit -m "Harden economy and reward validation [economy-hardening]"
          git push
