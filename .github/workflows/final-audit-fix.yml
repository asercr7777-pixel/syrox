name: Final audit fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply progression and scoring fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/store/useStore.ts')
          s = p.read_text(encoding='utf-8')

          marker = "function hashString(str: string): number {"
          start = s.index(marker)
          end = s.index("\n}\n\n// ---------------------------------------------------------------------------\n// Actions", start) + 2
          hash_block = s[start:end]
          if "function calculateDisciplineScore" not in s:
              helper = hash_block + "\n\nfunction calculateDisciplineScore(state: AppState): number {\n  const enabledMain = state.mainTasks.filter((t) => t.enabled);\n  const mainDone = enabledMain.filter((t) => state.coreCompleted[t.id]).length;\n  const extraDone = Object.values(state.customCompleted).filter(Boolean).length;\n  const totalPossible = enabledMain.length + state.customTasks.length;\n  return totalPossible > 0 ? Math.round(((mainDone + extraDone) / totalPossible) * 100) : 0;\n}"
              s = s[:start] + helper + s[end:]

          s = s.replace(
              "const totalPossible = enabledMain.length + Math.max(state.customTasks.length, 1);\n    const disciplineScore = Math.round(((mainDone + extraDone) / totalPossible) * 100);",
              "const disciplineScore = calculateDisciplineScore(state);",
              1,
          )
          s = s.replace(
              "const totalPossible = enabledMain.length + Math.max(next.customTasks.length, 1);\n  const disciplineScore = Math.round(((mainDone + extraDone) / totalPossible) * 100);",
              "const disciplineScore = calculateDisciplineScore(next);",
              1,
          )

          old_main = """    } else {\n      return {\n        ...next,\n        xp: Math.max(0, s.xp - task.points),\n        totalPoints: Math.max(0, s.totalPoints - task.points),\n        dailyXp: Math.max(0, s.dailyXp - task.points),\n        dailyPoints: Math.max(0, s.dailyPoints - task.points),\n      };\n    }"""
          new_main = """    } else {\n      const coinReward = Math.max(10, Math.floor(task.points * 0.3));\n      const xp = Math.max(0, s.xp - task.points);\n      return {\n        ...next,\n        xp,\n        level: levelFromXp(xp),\n        coins: Math.max(0, s.coins - coinReward),\n        totalPoints: Math.max(0, s.totalPoints - task.points),\n        dailyXp: Math.max(0, s.dailyXp - task.points),\n        dailyPoints: Math.max(0, s.dailyPoints - task.points),\n      };\n    }"""
          if old_main in s:
              s = s.replace(old_main, new_main, 1)

          old_custom = """    } else {\n      return {\n        ...next,\n        xp: Math.max(0, s.xp - task.points),\n        totalPoints: Math.max(0, s.totalPoints - task.points),\n        dailyXp: Math.max(0, s.dailyXp - task.points),\n        dailyPoints: Math.max(0, s.dailyPoints - task.points),\n      };\n    }"""
          new_custom = """    } else {\n      const coinReward = Math.max(5, Math.floor(task.points * 0.2));\n      const xp = Math.max(0, s.xp - task.points);\n      return {\n        ...next,\n        xp,\n        level: levelFromXp(xp),\n        coins: Math.max(0, s.coins - coinReward),\n        totalPoints: Math.max(0, s.totalPoints - task.points),\n        dailyXp: Math.max(0, s.dailyXp - task.points),\n        dailyPoints: Math.max(0, s.dailyPoints - task.points),\n      };\n    }"""
          if old_custom in s:
              s = s.replace(old_custom, new_custom, 1)

          p.write_text(s, encoding='utf-8')

      - name: Remove one-time workflow and commit fixes
        run: |
          rm -f .github/workflows/final-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useStore.ts .github/workflows/final-audit-fix.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "fix: prevent task reward exploits and unify discipline scoring"
          git push