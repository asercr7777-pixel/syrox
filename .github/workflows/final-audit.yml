name: Final UI audit
on:
  push:
    branches: [main]

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[final-audit]') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Clean audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/final-audit.yml
          git add -A
          git commit -m 'Finalize UI performance cleanup [final-audit]' || exit 0
          git push
