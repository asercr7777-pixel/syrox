name: Final typecheck diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[final-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final fix
        run: python .github/final-fix.py
      - name: Diagnose
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund > /tmp/npm.txt 2>&1
          echo "npm_ci_exit=$?" > validation-report.txt
          npm run typecheck > /tmp/typecheck.txt 2>&1
          echo "typecheck_exit=$?" >> validation-report.txt
          npm run lint > /tmp/lint.txt 2>&1
          echo "lint_exit=$?" >> validation-report.txt
          npm run build > /tmp/build.txt 2>&1
          echo "build_exit=$?" >> validation-report.txt
          cat /tmp/npm.txt /tmp/typecheck.txt /tmp/lint.txt /tmp/build.txt >> validation-report.txt
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useStore.ts validation-report.txt
          git rm .github/final-fix.py .github/workflows/final-fix.yml
          git commit -m "Finalize economy hardening with validation report [final-fix]"
          git push
