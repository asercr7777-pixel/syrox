name: Final validation fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[validation-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .github/fix-validation.py
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit and clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useStore.ts
          git rm .github/fix-validation.py .github/workflows/fix-validation.yml validation-report.txt
          git commit -m "Fix remaining typecheck issues [validation-fix]"
          git push
