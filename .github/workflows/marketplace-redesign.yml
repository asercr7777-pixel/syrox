name: Marketplace redesign
on:
  push:
    branches: [main]

jobs:
  redesign:
    if: contains(github.event.head_commit.message, '[marketplace-redesign]') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Marketplace visual system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/views/Marketplace.tsx')
          s = p.read_text()
          s = s.replace("import { Search, Coins, Lock, Check, Sparkles } from 'lucide-react';", "import { Search, Coins, Lock, Check, Sparkles } from 'lucide-react';\nimport '../styles/marketplace.css';")
          s = s.replace('<div className="space-y-6">', '<div className="marketplace-shell space-y-6">', 1)
          s = s.replace('className="section-title"', 'className="section-title marketplace-title"', 1)
          s = s.replace('className="text-sm text-ink-300">Purchase unique items with coins. Each item has its own artwork.</p>', 'className="text-sm text-ink-300 marketplace-subtitle">Purchase unique items with coins. Each item has its own artwork.</p>', 1)
          s = s.replace('className="grid grid-cols-1 min-[380px]:grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"', 'className="marketplace-grid grid grid-cols-1 min-[380px]:grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"', 1)
          p.write_text(s)
          PY
      - name: Add Marketplace styles
        run: |
          mkdir -p src/styles
          cat > src/styles/marketplace.css <<'CSS'
          .marketplace-shell{position:relative;isolation:isolate}
          .marketplace-shell:before{content:"";position:absolute;inset:-40px -24px auto;height:260px;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 25%,rgba(245,158,11,.11),transparent 35%),radial-gradient(circle at 85% 10%,rgba(99,102,241,.09),transparent 34%);filter:blur(18px)}
          .marketplace-title{letter-spacing:-.035em;text-shadow:0 0 28px rgba(245,158,11,.12)}
          .marketplace-subtitle{max-width:680px}
          .marketplace-shell .card-premium{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
          .marketplace-shell .marketplace-grid>.card-premium{overflow:hidden;min-height:285px;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
          .marketplace-shell .marketplace-grid>.card-premium:hover{transform:translateY(-4px);box-shadow:0 18px 42px rgba(0,0,0,.32),0 0 28px color-mix(in srgb,var(--glow-color,#f59e0b) 16%,transparent)}
          .marketplace-shell .marketplace-grid>.card-premium:active{transform:translateY(-1px)}
          .marketplace-shell .marketplace-grid button:focus-visible,.marketplace-shell button:focus-visible,.marketplace-shell input:focus-visible,.marketplace-shell select:focus-visible{outline:2px solid rgba(245,158,11,.7);outline-offset:2px}
          .marketplace-shell .marketplace-grid .group>button:first-of-type{min-height:166px;padding:8px 4px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 72%);border:1px solid rgba(255,255,255,.045)}
          .marketplace-shell .marketplace-grid .group>button:first-of-type:hover{background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 72%)}
          .marketplace-shell .marketplace-grid .group>button:first-of-type p:first-of-type{max-width:92%;text-shadow:0 2px 10px rgba(0,0,0,.4)}
          .marketplace-shell .marketplace-grid .group>div:last-child{position:relative;z-index:2}
          .marketplace-shell .input{background:rgba(8,10,16,.72);border-color:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 8px 24px rgba(0,0,0,.12)}
          .marketplace-shell .input:hover{border-color:rgba(255,255,255,.14)}
          .marketplace-shell select.input{min-height:42px}
          .marketplace-shell .glow-ring{box-shadow:0 0 0 1px color-mix(in srgb,var(--glow-color,#f59e0b) 12%,transparent),0 10px 32px rgba(0,0,0,.22)}
          @media (max-width:639px){
            .marketplace-shell{margin-inline:-2px}
            .marketplace-shell:before{inset:-20px -10px auto;height:190px}
            .marketplace-shell .marketplace-grid{gap:10px}
            .marketplace-shell .marketplace-grid>.card-premium{min-height:270px;padding:10px}
            .marketplace-shell .marketplace-grid .group>button:first-of-type{min-height:150px}
          }
          @media (prefers-reduced-motion:reduce){.marketplace-shell .marketplace-grid>.card-premium,.marketplace-shell .marketplace-grid>.card-premium:hover{transition:none;transform:none}.marketplace-shell .marketplace-grid .group>button:first-of-type{transition:none}}
          CSS
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit and clean workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/views/Marketplace.tsx src/styles/marketplace.css
          git commit -m 'Redesign Marketplace UI [marketplace-redesign]' || exit 0
          git push
