name: Production audit safeguards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply safeguards
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          # Track workout reward claims per dayId so toggling exercises cannot
          # mint the same 150 XP reward repeatedly.
          replace('src/store/types.ts',
              "  workoutsCompletedToday: number;\n  lastWorkoutDate: string | null;",
              "  workoutsCompletedToday: number;\n  workoutRewardsClaimedToday: Record<'push' | 'pull' | 'leg', boolean>;\n  lastWorkoutDate: string | null;")

          replace('src/store/defaults.ts',
              "    workoutsCompletedToday: 0,\n    lastWorkoutDate: null,",
              "    workoutsCompletedToday: 0,\n    workoutRewardsClaimedToday: { push: false, pull: false, leg: false },\n    lastWorkoutDate: null,")

          replace('src/store/useStore.ts',
              "    bossHpRemaining: cloudState.bossHpRemaining ?? {},\n    bossDefeated: cloudState.bossDefeated ?? {},",
              "    bossHpRemaining: cloudState.bossHpRemaining ?? {},\n    bossDefeated: cloudState.bossDefeated ?? {},\n    workoutRewardsClaimedToday: { push: false, pull: false, leg: false, ...(cloudState.workoutRewardsClaimedToday ?? {}) },")

          replace('src/store/useStore.ts',
              "      workoutsCompletedToday: 0,\n      workouts: {",
              "      workoutsCompletedToday: 0,\n      workoutRewardsClaimedToday: { push: false, pull: false, leg: false },\n      workouts: {")

          old = """    if (allDone && !s.workouts[dayId].every((e) => e.completed)) {\n      workoutsCompleted += 1;\n      lastWorkout = todayStr();\n      playSound('task');\n      const withXp = addPoints(s, 150, 150);\n      return {\n        ...withXp,\n        workouts: { ...s.workouts, [dayId]: exercises },\n        workoutsCompletedToday: workoutsCompleted,\n        lastWorkoutDate: lastWorkout,\n      };\n    }"""
          new = """    const alreadyRewarded = s.workoutRewardsClaimedToday?.[dayId] ?? false;\n    if (allDone && !s.workouts[dayId].every((e) => e.completed) && !alreadyRewarded) {\n      workoutsCompleted += 1;\n      lastWorkout = todayStr();\n      playSound('task');\n      const withXp = addPoints(s, 150, 150);\n      return {\n        ...withXp,\n        workouts: { ...s.workouts, [dayId]: exercises },\n        workoutsCompletedToday: workoutsCompleted,\n        workoutRewardsClaimedToday: { ...s.workoutRewardsClaimedToday, [dayId]: true },\n        lastWorkoutDate: lastWorkout,\n      };\n    }"""
          replace('src/store/useStore.ts', old, new)

          # Keep Discipline Score limited to real, currently configured tasks;
          # stale completion keys should never inflate the score.
          old = """function calculateDisciplineScore(state: AppState): number {\n  const enabledMain = state.mainTasks.filter((t) => t.enabled);\n  const mainDone = enabledMain.filter((t) => state.coreCompleted[t.id]).length;\n  const extraDone = Object.values(state.customCompleted).filter(Boolean).length;\n  const totalPossible = enabledMain.length + state.customTasks.length;\n  return totalPossible > 0 ? Math.round(((mainDone + extraDone) / totalPossible) * 100) : 0;\n}"""
          new = """function calculateDisciplineScore(state: AppState): number {\n  const enabledMain = state.mainTasks.filter((t) => t.enabled);\n  const mainDone = enabledMain.filter((t) => state.coreCompleted[t.id]).length;\n  const activeCustomIds = new Set(state.customTasks.map((t) => t.id));\n  const extraDone = Object.entries(state.customCompleted).filter(([id, done]) => done && activeCustomIds.has(id)).length;\n  const totalPossible = enabledMain.length + state.customTasks.length;\n  if (totalPossible <= 0) return 0;\n  return Math.max(0, Math.min(100, Math.round(((mainDone + extraDone) / totalPossible) * 100)));\n}"""
          replace('src/store/useStore.ts', old, new)

          # Supabase upsert resolves with { error } rather than throwing for a
          # normal database error, so surface it explicitly.
          old = """    await supabase.from('user_state').upsert({\n      user_id: globalUserId,\n      state,\n      updated_at: new Date().toISOString(),\n    }, { onConflict: 'user_id' });"""
          new = """    const { error } = await supabase.from('user_state').upsert({\n      user_id: globalUserId,\n      state,\n      updated_at: new Date().toISOString(),\n    }, { onConflict: 'user_id' });\n    if (error) console.error('[saveToCloud] database error:', error);"""
          replace('src/store/useStore.ts', old, new)

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/production-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/types.ts src/store/defaults.ts src/store/useStore.ts .github/workflows/production-audit.yml
          git diff --cached --quiet && exit 0 || (git commit -m "fix: harden progression rewards and persistence" && git push)