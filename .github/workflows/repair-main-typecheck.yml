name: repair-main-typecheck
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'src/App.tsx': [("const target=v==='worldmap'?'story':v;", "const target=v;")],
            'src/store/useStore.ts': [("withXp=markDailyTaskActivity(withPoints);", "withXp=markDailyTaskActivity(withXp);")],
            'src/components/SixDayWorkout.tsx': [("completeStoryMission(mission.id, { xp: mission.xpReward })", "completeStoryMission(mission.id, { xp: mission.xpReward, coins: 0 })")],
            'src/views/StoryModeSimpleV2.tsx': [("completeStoryMission(m.id, { xp: m.xpReward })", "completeStoryMission(m.id, { xp: m.xpReward, coins: 0 })"), ("completeStoryMission(`boss_${b.id}`, { xp: b.xpReward })", "completeStoryMission(`boss_${b.id}`, { xp: b.xpReward, coins: 0 })")],
          }
          for file, pairs in replacements.items():
            p=Path(file); s=p.read_text()
            for old,new in pairs:
              if old not in s:
                raise SystemExit(f'missing expected text in {file}: {old}')
              s=s.replace(old,new)
            p.write_text(s)
          import json
          p=Path('package.json'); data=json.loads(p.read_text())
          deps=data.setdefault('dependencies', {})
          if 'framer-motion' not in deps:
            deps['framer-motion']='^12.43.0'
            p.write_text(json.dumps(data, indent=2)+'\n')
          PY
          npm install --package-lock-only --ignore-scripts
          rm -f .github/workflows/repair-main-typecheck.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/store/useStore.ts src/components/SixDayWorkout.tsx src/views/StoryModeSimpleV2.tsx package.json package-lock.json .github/workflows/repair-main-typecheck.yml
          git commit -m "fix: clear remaining typecheck errors" || exit 0
          git push origin HEAD:main
