name: repair-workout-store
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/store/useStore.ts')
          s=p.read_text()
          old='return{...withPoints,workouts:{...s.workouts,[dayId]:exercises}'
          new='return{...withXp,workouts:{...s.workouts,[dayId]:exercises}'
          if old not in s: raise SystemExit('expected workout return not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/repair-workout-store.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/store/useStore.ts .github/workflows/repair-workout-store.yml
          git commit -m "fix: correct workout reward state" && git push origin HEAD:main || true
