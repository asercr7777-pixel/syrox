name: Temporary safe dependency remediation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    if: contains(github.event.head_commit.message, 'SAFE-AUDIT-REMEDIATION')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply compatible npm audit fixes only
        run: npm audit fix || echo "Validating Tailwind v4 migration and resolving the remaining dependency advisories."
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Report remaining vulnerabilities
        run: |
          npm audit --json > /tmp/npm-audit-report.json || true
          node -e "const r = require('/tmp/npm-audit-report.json'); console.log('POST-FIX AUDIT SUMMARY ' + JSON.stringify(r.metadata?.vulnerabilities ?? {})); console.log('POST-FIX AUDIT PACKAGES ' + JSON.stringify(Object.entries(r.vulnerabilities ?? {}).map(([name, v]) => ({ name, severity: v.severity, direct: v.isDirect, range: v.range, fixAvailable: v.fixAvailable }))))"
      - name: Commit validated lockfile updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible dependency updates were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "[skip ci] chore: apply compatible npm security updates"
          git push origin HEAD:main
